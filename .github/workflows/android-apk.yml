name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Native project is generated from app.json (never hand-edited).
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Every build gets a higher versionCode so a new APK installs over the old one.
      - name: Set versionCode
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      # Release builds from the Expo template are signed with the template's debug keystore,
      # which is identical on every run, so updates install cleanly over earlier builds.
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Rubbernecker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rubbernecker-apk
          path: app/Rubbernecker.apk
          retention-days: 30

      - name: Publish to the "latest" release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest app/Rubbernecker.apk \
            --title "Rubbernecker — latest build" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes "Build #${{ github.run_number }} from ${GITHUB_SHA::7}. Download **Rubbernecker.apk** on your Android phone, open it, and allow installs from this source when asked."
